name: Test cask

# Filamental is developed on Windows, so the cask can never be checked
# locally. This is the only thing standing between a bad sha256 or a moved
# download URL and a broken `brew install` for every Mac user.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      # Deliberately NOT Homebrew/actions/setup-homebrew. That action symlinks
      # this repo into the Taps directory and pre-trusts it, which hides the
      # tap-trust behaviour we most need to test. Its post-job cleanup then
      # fails outright once the install step below re-taps the same path as a
      # real clone. The runner already ships Homebrew, so just update it.
      - name: Update Homebrew
        run: brew update

      # style and audit are developer commands that have to load our Ruby, so
      # the tap must be trusted for them to run at all.
      - name: Tap and trust
        run: |
          brew tap scottnine/filamental https://github.com/Scottnine/homebrew-filamental
          brew trust scottnine/filamental

      - name: Style
        run: brew style scottnine/filamental

      - name: Audit
        env:
          # --online hits the GitHub API to check the download URL, and the 60
          # requests/hour unauthenticated limit is shared across the whole
          # runner IP, so it is reliably already exhausted. The job's own token
          # is enough; no additional secret is needed.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --online scottnine/filamental/filamental

      # Since Homebrew 5.1.15 a third-party tap must be trusted before its Ruby
      # is evaluated at all. Drop back to an untrusted, untapped machine so the
      # install below is what a real first-time user actually gets, rather than
      # something that only works because CI already trusted us.
      - name: Reset to a first-time-user state
        run: |
          brew untrust scottnine/filamental
          brew untap scottnine/filamental

      # The real test: downloads the DMG, verifies the checksum, mounts it and
      # links the app. Catches a stale sha256 and a renamed .app bundle, which
      # audit alone does not. This must stay character-for-character the command
      # the README tells people to run. A fully qualified cask name auto-taps
      # and trusts that one cask, which is why no `brew trust` is needed here.
      - name: Install exactly as the README instructs
        run: brew install --cask scottnine/filamental/filamental

      - name: Confirm the app landed
        run: |
          test -d "/Applications/Filamental.app" || {
            echo "Filamental.app is not in /Applications"; exit 1;
          }
          codesign --verify --deep --strict --verbose=1 "/Applications/Filamental.app"
          spctl --assess --type execute --verbose "/Applications/Filamental.app"

      - name: Uninstall
        run: brew uninstall --cask scottnine/filamental/filamental
